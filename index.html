<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>POLLITOX PRO · Telegram</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf1fb;background:#0a1425}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#18345c,#0a1425 52%);min-height:100vh}.app{max-width:460px;margin:auto;padding:22px 17px 32px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mascot{width:60px;height:60px;background:#ffd338;border-radius:18px;display:grid;place-items:center;font-size:35px;box-shadow:0 8px 26px #ffda4030}h1{margin:0;color:#ffd338;font-size:28px;letter-spacing:1.2px}.sub{font-size:11px;color:#9eafc6;letter-spacing:1px}.panel{background:#182a43;border:1px solid #2c4260;border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 10px 28px #0002}.status{display:inline-block;border-radius:100px;background:#143f35;color:#79e0b4;padding:6px 10px;font-size:11px;font-weight:700}.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px}h2{font-size:18px;margin:0 0 9px}p{color:#bdcbe0;font-size:13px;line-height:1.55;margin:6px 0 15px}.label{font-size:12px;font-weight:700;margin-bottom:9px;display:block}.field{width:100%;padding:14px;border-radius:12px;background:#0e1c31;border:1px solid #344a67;color:#fff;font-size:13px;outline:none}.field:focus{border-color:#ffd338}.primary{background:#ffd338;color:#152035;border:0;border-radius:12px;padding:14px 16px;font-weight:900;cursor:pointer;width:100%;margin-top:12px}.primary:hover{background:#ffe27a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:#192b45;border:1px solid #2c4260;border-radius:17px;padding:17px 12px;text-align:left;color:#fff;cursor:pointer;min-height:110px}.tile:hover{border-color:#ffd338}.tile .emoji{font-size:23px;display:block;margin-bottom:12px}.tile b{display:block;font-size:13px}.tile small{display:block;color:#9aabc4;margin-top:4px;font-size:10px}.admin{margin-top:14px}.admin .tile{min-height:85px}.bottom{display:flex;justify-content:space-around;margin-top:20px;padding:15px;background:#13243a;border-radius:16px;color:#aebdd1;font-size:11px}.bottom span:first-child{color:#ffd338}.note{font-size:11px;color:#9daec4;text-align:center;margin-top:16px}.hidden{display:none}.message{margin-top:12px;padding:12px;background:#102b38;border:1px solid #286d67;border-radius:12px;color:#c9f6e9;font-size:12px}.badge{font-size:11px;color:#ffd338}.back{background:none;color:#ffd338;border:0;cursor:pointer;margin-bottom:15px;font-size:13px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #30435e;padding:12px 0;font-size:13px}.row:last-child{border:0}.muted{color:#a8b7cb}a{color:#ffd338}</style></head><body><main class="app"><header class="top"><div class="mascot">🐣</div><div><h1>POLLITOX</h1><div style="font-weight:700">SHEIN ID · PRO</div><div class="sub">CENTRO INTELIGENTE DE EXTRACCIÓN</div></div></header><section id="home"><div class="panel"><div class="headrow"><h2>¡Hola! 👋</h2><span class="status">● Verificación en Telegram</span></div><p>Bienvenido a tu panel. Organiza tus artículos SHEIN de forma rápida y sencilla.</p><label class="label" for="link">🔗 Nueva extracción</label><input autocomplete="off" class="field" id="link" placeholder="Pega aquí tu enlace de SHEIN..."/><button class="primary" id="extract">⚡ EXTRAER ARTÍCULOS</button><div class="hidden message" id="result"></div></div><div class="grid"><button class="tile" data-page="help"><span class="emoji">❔</span><b>Ayuda</b><small>Cómo utilizarlo</small></button><button class="tile" data-page="support"><span class="emoji">🎧</span><b>Soporte</b><small>Contactar al administrador</small></button></div></section><section class="hidden" id="detail"><button class="back" id="back">← Volver al inicio</button><div class="panel"><h2 id="detailtitle"></h2><div id="detailcontent"></div></div></section><div class="note">Panel conectado al bot para solicitar extracciones · Las funciones administrativas se gestionan en Telegram</div></main><script>const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()} const pages={help:['❔ Ayuda','1. Copia el enlace compartido de tu carrito SHEIN. 2. Pégalo en el campo principal. 3. Pulsa Extraer artículos. 4. Recibe el Excel y las tablas de fotografías cuando la integración esté habilitada.'],support:['🎧 Soporte','Para soporte, escribe directamente al administrador del bot.'],};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{let p=pages[b.dataset.page];document.getElementById('detailtitle').textContent=p[0];document.getElementById('detailcontent').innerHTML='';let el=document.createElement('p');el.textContent=p[1];document.getElementById('detailcontent').appendChild(el);document.getElementById('home').classList.add('hidden');document.getElementById('detail').classList.remove('hidden')});document.getElementById('back').onclick=()=>{document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden')};document.getElementById('extract').onclick=()=>{const url=document.getElementById('link').value.trim(),r=document.getElementById('result');r.classList.remove('hidden');if(!/^https:\/\/([a-z0-9-]+\.)*(shein\.com|shein\.co\.uk)\//i.test(url)){r.textContent='⚠️ Pega un enlace HTTPS válido de SHEIN para probar el formulario.';return}if(!tg || typeof tg.sendData !== 'function'){r.textContent='⚠️ Abre POLLITOX desde el botón del teclado de Telegram para enviar tu solicitud.';return}try{tg.sendData(JSON.stringify({action:'extract',url:url}));r.textContent='🐣 Solicitud enviada. Revisa el chat de Telegram para recibir el progreso, Excel y fotografías.'}catch(e){r.textContent='⚠️ No se pudo enviar la solicitud. Cierra esta ventana y vuelve a abrir POLLITOX desde Telegram.'}};</script></body></html>
